name: Nightly Checks

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM UTC every night
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "npm"

      - run: |
          npm ci --ignore-scripts

      - name: Strict Lints
        run: npm run lint:ci

      - name: Security Audit
        run: npm run audit:ci

      - name: Mutation Tests
        run: npm run test:mutation
        
      - name: API OpenAPI Specs Validation
        run: npm run api:lint

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --verbose --no-progress './**/*.md' './**/*.html'
          fail: true

      - name: Docs Generation Scan
        run: npm run docs
