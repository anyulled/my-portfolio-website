name: AI Harness Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harness-scorecard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: markmishaev76/ai-harness-scorecard@baf1c269e091415d6616a9502a6a045a1bcf78b0
      - name: Publish advisory report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scorecard_worktree="${RUNNER_TEMP}/scorecard"
          if git fetch origin scorecard; then
            git worktree add --detach "${scorecard_worktree}" origin/scorecard
          else
            git worktree add --detach "${scorecard_worktree}"
            git -C "${scorecard_worktree}" checkout --orphan scorecard
            git -C "${scorecard_worktree}" rm -rf .
          fi
          cp scorecard-badge.json "${scorecard_worktree}/scorecard-badge.json"
          cp scorecard-report.md "${scorecard_worktree}/scorecard-report.md"
          git -C "${scorecard_worktree}" add scorecard-badge.json scorecard-report.md
          git -C "${scorecard_worktree}" diff --cached --quiet || git -C "${scorecard_worktree}" commit -m "chore: update scorecard badge and report"
          git -C "${scorecard_worktree}" push origin HEAD:scorecard
