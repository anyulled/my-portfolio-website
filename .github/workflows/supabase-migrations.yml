name: Supabase migrations

on:
  push:
    branches:
      - main

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-production:
    name: Apply production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PAT }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359

      - name: Validate production migration configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_PAT repository secret is required."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::The SUPABASE_DB_PASSWORD repository secret is required."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co)
              project_ref="${SUPABASE_URL#https://}"
              project_ref="${project_ref%.supabase.co}"
              ;;
            *)
              echo "::error::The SUPABASE_URL repository variable must use a *.supabase.co project URL."
              exit 1
              ;;
          esac
          if [ -z "$project_ref" ]; then
            echo "::error::Could not determine a Supabase project ref from SUPABASE_URL."
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: npm run supabase:migrate:remote -- --dry-run

      - name: Apply pending migrations
        run: npm run supabase:migrate:remote
